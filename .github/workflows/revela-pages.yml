# Revela: pruebas, build (motor → wasm, interfaz → Vite) y despliegue en GitHub Pages.
# https://nikporras.github.io/revela/
name: revela

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/revela/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/revela-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revela-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deben coincidir con wasm-bindgen en Cargo.lock y con el wasm-opt que usa trunk.
  WASM_BINDGEN_VERSION: 0.2.129
  BINARYEN_VERSION: version_123

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: revela
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/revela/web/package-lock.json

      - name: Instalar wasm-bindgen y wasm-opt
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Pruebas del núcleo (Rust)
        run: cargo test -p revela-core

      - name: Compilar el motor a wasm
        run: apps/revela/build-wasm.sh

      - name: Compilar la interfaz
        working-directory: apps/revela/web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      # Bloquea el despliegue si la previa (shader de la GPU) y la exportación (motor) difieren en
      # más de 1/255 o si la GPU aplana los degradados (bandas). Ver web/pruebas/igualdad.mjs.
      - name: Prueba de igualdad previa / exportación
        working-directory: apps/revela/web
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npm run prueba:igualdad

      - name: Tamaño del wasm
        run: |
          wasm=$(ls apps/revela/web/dist/assets/*.wasm)
          {
            echo "### Revela: tamaño del motor"
            echo
            echo "| Archivo | Sin comprimir | gzip |"
            echo "| --- | ---: | ---: |"
            echo "| $(basename "$wasm") | $(numfmt --to=iec --suffix=B "$(wc -c < "$wasm")") | $(numfmt --to=iec --suffix=B "$(gzip -9 -c "$wasm" | wc -c)") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/revela/web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
