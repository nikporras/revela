[package]
name = "revela-core"
description = "Revela: puente WebAssembly entre la interfaz móvil y el motor de PhotoCraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
# HEIC/HEIF de iPhone (decodificador en Rust puro).
photocraft-codecs = { workspace = true, features = ["heif"] }
photocraft-compose = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-algo = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
